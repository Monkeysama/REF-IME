name: Build tag

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing Git tag to build (e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

# 同一标签的构建串行发布，避免重复运行同时创建 Release 或替换相同资产。
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Windows x64 DLL
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      # 将外部输入经环境变量传给 PowerShell，验证后再用于 checkout 和文件名。
      - name: Validate tag
        id: version
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          PUSH_TAG: ${{ github.ref_name }}
        run: |
          $tag = if ($env:EVENT_NAME -eq 'workflow_dispatch') { $env:REQUESTED_TAG } else { $env:PUSH_TAG }
          if ($tag -cnotmatch '\Av(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\z') {
            throw 'Tag must have the form vN.N.N, e.g. v1.0.0.'
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$($tag.Substring(1))" >> $env:GITHUB_OUTPUT

      - name: Check out the requested tag
        uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ steps.version.outputs.tag }}
          persist-credentials: false

      - name: Fetch locked source dependencies
        run: ./tools/bootstrap.ps1

      # 测试为本地开发内容；CI 只编译发布 DLL，避免依赖被本机忽略的 tests/。
      - name: Build Release DLL
        env:
          PLUGIN_VERSION: ${{ steps.version.outputs.version }}
        run: ./tools/build.ps1 -SkipTests -Version $env:PLUGIN_VERSION

      - name: Package and verify DLL-only ZIP
        env:
          BUILD_TAG: ${{ steps.version.outputs.tag }}
        run: ./tools/package.ps1 -Tag $env:BUILD_TAG

      - name: Upload ZIP
        uses: actions/upload-artifact@v7
        with:
          path: dist/REF-IME-${{ steps.version.outputs.tag }}-windows-x64.zip
          if-no-files-found: error
          retention-days: 30
          archive: false

      # 直接使用 runner 自带 gh；即使手动构建旧标签，也执行默认分支的新版发布步骤。
      - name: Publish ZIP to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $asset = Join-Path $PWD "dist/REF-IME-$($env:RELEASE_TAG)-windows-x64.zip"
          if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) { throw 'Release ZIP is missing.' }
          # 先确认标签确实存在；不能用 release create 隐式生成指向错误提交的新标签。
          gh api "repos/$env:GH_REPO/git/ref/tags/$env:RELEASE_TAG" --silent
          if ($LASTEXITCODE -ne 0) { throw 'Cannot access the requested Git tag.' }
          gh release view $env:RELEASE_TAG --repo $env:GH_REPO --json url | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG $asset --repo $env:GH_REPO --clobber
          } else {
            gh release create $env:RELEASE_TAG $asset --repo $env:GH_REPO --verify-tag --title "REF-IME $env:RELEASE_TAG" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw 'Failed to publish the Release ZIP.' }
          $releaseUrl = gh release view $env:RELEASE_TAG --repo $env:GH_REPO --json url --jq .url
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify the published Release.' }
          "Release: $releaseUrl" >> $env:GITHUB_STEP_SUMMARY
